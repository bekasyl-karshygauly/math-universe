<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Universe — Интерактивная математика</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
:root{
  --bg:#f4f6fb;--surface:#fff;--surface2:#eef1f8;--text:#141829;--muted:#6b7280;
  --primary:#4f46e5;--primary2:#7c3aed;--accent:#06b6d4;
  --success:#10b981;--warning:#f59e0b;--danger:#ef4444;
  --border:#e5e7eb;--shadow:0 4px 24px rgba(0,0,0,.07);--radius:16px;
}
[data-theme="dark"]{
  --bg:#0d1117;--surface:#161b28;--surface2:#1e2536;--text:#e8eaf2;--muted:#9aa1b5;
  --border:#252d42;--shadow:0 4px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.65;transition:background .3s,color .3s}
button{cursor:pointer;font-family:inherit;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
::selection{background:rgba(79,70,229,.3)}

/* ===== HEADER ===== */
.header{position:sticky;top:0;z-index:200;background:color-mix(in srgb,var(--surface) 85%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.hwrap{max-width:1440px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}
.logo-badge{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;box-shadow:0 4px 14px rgba(124,58,237,.4)}
.hdr-controls{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lang-sw{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.lang-btn{padding:6px 12px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted);transition:.2s}
.lang-btn.active{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 3px 10px rgba(124,58,237,.35)}
.icon-btn{width:38px;height:38px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:17px;transition:.2s;border:1px solid var(--border)}
.icon-btn:hover{transform:translateY(-2px);border-color:var(--primary)}

/* ===== NAV TABS ===== */
.nav{display:flex;gap:6px;overflow-x:auto;padding:10px 22px;max-width:1440px;margin:0 auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-btn{padding:9px 16px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap;transition:.2s;border:1px solid transparent}
.nav-btn:hover{background:var(--surface2);color:var(--text)}
.nav-btn.active{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 4px 12px rgba(124,58,237,.3)}

.container{max-width:1440px;margin:0 auto;padding:26px 22px}
.page{display:none;animation:fadeIn .45s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ===== HERO ===== */
.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed 45%,#06b6d4);border-radius:24px;padding:46px 40px;color:#fff;position:relative;overflow:hidden;margin-bottom:30px}
.hero::before{content:"";position:absolute;width:480px;height:480px;top:-55%;right:-12%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%);border-radius:50%}
.hero h1{font-size:38px;font-weight:800;margin-bottom:12px;position:relative;line-height:1.2}
.hero p{font-size:17px;opacity:.96;max-width:640px;position:relative}
.hero-stats{display:flex;gap:16px;margin-top:26px;flex-wrap:wrap;position:relative}
.hstat{background:rgba(255,255,255,.14);backdrop-filter:blur(10px);padding:15px 20px;border-radius:13px;border:1px solid rgba(255,255,255,.22);min-width:130px}
.hstat b{display:block;font-size:25px;font-weight:800}
.hstat span{font-size:12.5px;opacity:.92}

/* ===== SEARCH ===== */
.search-bar{display:flex;gap:10px;margin-bottom:24px}
.search-input{flex:1;padding:13px 18px;background:var(--surface);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:15px}
.search-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.15)}

/* ===== SECTION TITLE ===== */
.sec-title{font-size:25px;font-weight:800;margin:6px 0 20px;display:flex;align-items:center;gap:12px}
.sec-title::before{content:"";width:5px;height:30px;background:linear-gradient(var(--primary),var(--primary2));border-radius:3px}
.sec-sub{color:var(--muted);margin:-14px 0 22px;font-size:15px}

/* ===== COURSE CARDS ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px;margin-bottom:38px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;transition:.3s;cursor:pointer;position:relative;overflow:hidden}
.card:hover{transform:translateY(-5px);box-shadow:var(--shadow);border-color:var(--primary)}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--primary),var(--primary2))}
.card-icon{width:52px;height:52px;border-radius:13px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;margin-bottom:15px}
.card h3{font-size:18px;margin-bottom:7px}
.card p{color:var(--muted);font-size:14px;margin-bottom:14px}
.prog-bar{height:7px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-bottom:8px}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));transition:width .6s;border-radius:4px}
.card-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

/* ===== LESSON ===== */
.lesson-wrap{background:var(--surface);border-radius:var(--radius);padding:30px;border:1px solid var(--border)}
.lesson-head{display:flex;align-items:center;gap:16px;margin-bottom:22px;padding-bottom:20px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.lesson-icon{width:58px;height:58px;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:flex;align-items:center;justify-content:center;font-size:29px;color:#fff}
.lesson-head h2{font-size:27px}
.back-btn{margin-left:auto;padding:9px 17px;background:var(--surface2);border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);transition:.2s}
.back-btn:hover{color:var(--text);border:1px solid var(--primary)}

.chapter{margin-bottom:16px;border:1px solid var(--border);border-radius:13px;overflow:hidden}
.ch-head{padding:17px 21px;background:var(--surface2);cursor:pointer;display:flex;align-items:center;gap:13px;font-weight:700;transition:.2s;user-select:none}
.ch-head:hover{background:color-mix(in srgb,var(--primary) 10%,var(--surface2))}
.ch-num{width:31px;height:31px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:800;flex-shrink:0}
.ch-check{margin-left:auto;color:var(--success);font-weight:800}
.ch-arrow{transition:.3s;color:var(--muted)}
.chapter.open .ch-arrow{transform:rotate(180deg)}
.ch-body{max-height:0;overflow:hidden;transition:max-height .5s ease}
.chapter.open .ch-body{max-height:8000px;padding:22px}

.formula-box{background:color-mix(in srgb,var(--primary) 8%,var(--surface));border-left:3px solid var(--primary);padding:16px 20px;border-radius:9px;margin:14px 0;overflow-x:auto}
.example-box{background:var(--surface2);border-radius:11px;padding:16px 20px;margin:14px 0;border:1px dashed var(--border)}
.example-box b{color:var(--primary)}
.tip-box{background:color-mix(in srgb,var(--success) 9%,var(--surface));border-left:3px solid var(--success);padding:14px 18px;border-radius:9px;margin:14px 0;font-size:14px}
.warn-box{background:color-mix(in srgb,var(--warning) 10%,var(--surface));border-left:3px solid var(--warning);padding:14px 18px;border-radius:9px;margin:14px 0;font-size:14px}
.lesson-wrap h4{margin:18px 0 10px;font-size:17px;color:var(--primary)}
.lesson-wrap ul,.lesson-wrap ol{margin:10px 0 10px 24px}
.lesson-wrap li{margin-bottom:7px}
.lesson-wrap p{margin-bottom:11px}

.mark-read{margin-top:18px;padding:12px 26px;background:linear-gradient(135deg,var(--success),#059669);color:#fff;border-radius:11px;font-weight:700;transition:.2s}
.mark-read:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(16,185,129,.35)}
.mark-read.done{background:var(--surface2);color:var(--success);border:2px solid var(--success)}

/* ===== TABS & PANELS ===== */
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.tab{padding:10px 18px;background:var(--surface);border:1px solid var(--border);border-radius:10px;font-weight:600;font-size:13.5px;transition:.2s;color:var(--muted)}
.tab:hover{color:var(--text)}
.tab.active{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border-color:transparent}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;display:none}
.panel.active{display:block;animation:fadeIn .35s}
.panel h3{margin-bottom:18px;font-size:20px}

.inp-grid{display:grid;gap:13px;margin-bottom:18px}
.inp-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.inp-row label{min-width:130px;font-weight:600;font-size:14px}
.inp{flex:1;min-width:110px;padding:11px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:15px}
.inp:focus{outline:none;border-color:var(--primary)}
.btn{padding:12px 26px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border-radius:11px;font-weight:700;transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(124,58,237,.35)}
.btn-sec{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.result{margin-top:20px;padding:20px;background:color-mix(in srgb,var(--primary) 7%,var(--surface));border-radius:12px;min-height:55px;font-size:15px;border-left:3px solid var(--primary)}
.step{margin:7px 0;padding:9px 13px;background:var(--surface);border-radius:8px;font-size:14px;border:1px solid var(--border)}

.matrix-grid{display:grid;gap:7px;margin:12px 0}
.matrix-grid input{width:64px;padding:9px;text-align:center;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text)}

/* ===== QUIZ ===== */
.quiz-setup{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;margin-bottom:20px}
.q-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin:12px 0}
.q-opt{padding:13px;background:var(--surface2);border:2px solid var(--border);border-radius:11px;cursor:pointer;transition:.2s;text-align:center;font-weight:700;font-size:14px}
.q-opt:hover{border-color:var(--primary)}
.q-opt.sel{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,var(--surface2))}
.quiz-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px}
.quiz-q{font-size:20px;font-weight:700;margin-bottom:20px}
.q-answers{display:grid;gap:10px;margin-bottom:20px}
.q-ans{padding:14px 18px;background:var(--surface2);border:2px solid var(--border);border-radius:11px;cursor:pointer;transition:.2s;text-align:left;font-size:15px}
.q-ans:hover{border-color:var(--primary)}
.q-ans.sel{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,var(--surface2))}
.q-ans.correct{border-color:var(--success);background:color-mix(in srgb,var(--success) 14%,var(--surface2))}
.q-ans.wrong{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 14%,var(--surface2))}
.quiz-score{font-size:62px;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--primary2));-webkit-background-clip:text;background-clip:text;color:transparent;margin:18px 0}

/* ===== NOTES ===== */
.notes-area{width:100%;min-height:280px;padding:18px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:15px;resize:vertical;font-family:inherit}
.notes-area:focus{outline:none;border-color:var(--primary)}

/* ===== PLOT ===== */
.plot-canvas{width:100%;height:420px;background:var(--surface2);border-radius:12px;display:block;border:1px solid var(--border)}

/* ===== LIFEHACK ===== */
.hack-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;transition:.25s}
.hack-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--primary2)}
.hack-card h4{color:var(--primary);margin-bottom:8px;font-size:16px}
.hack-card p{font-size:14px;color:var(--muted)}

.footer{text-align:center;padding:30px;color:var(--muted);font-size:13px;border-top:1px solid var(--border);margin-top:44px}

/* toast */
.toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--success);color:var(--text);padding:14px 22px;border-radius:12px;box-shadow:var(--shadow);z-index:999;opacity:0;transform:translateY(20px);transition:.35s;pointer-events:none;font-weight:600}
.toast.show{opacity:1;transform:translateY(0)}

@media(max-width:768px){
  .hero{padding:30px 22px}.hero h1{font-size:27px}
  .lesson-wrap{padding:20px}
  .hwrap{padding:10px 14px}
}
</style>
</head>
<body>

<header class="header">
  <div class="hwrap">
    <div class="logo"><div class="logo-badge">∞</div><span>Math Universe</span></div>
    <div class="hdr-controls">
      <div class="lang-sw">
        <button class="lang-btn active" data-lang="ru">RU</button>
        <button class="lang-btn" data-lang="kz">KZ</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
      <button class="icon-btn" id="themeToggle" title="Theme">🌙</button>
      <button class="icon-btn" onclick="resetAll()" title="Reset">🗑️</button>
    </div>
  </div>
  <nav class="nav" id="mainNav"></nav>
</header>

<main class="container">

<!-- HOME -->
<section class="page active" id="page-home">
  <div class="hero">
    <h1 data-i18n="hero_title"></h1>
    <p data-i18n="hero_sub"></p>
    <div class="hero-stats">
      <div class="hstat"><b id="st-prog">0%</b><span data-i18n="st_progress"></span></div>
      <div class="hstat"><b id="st-lessons">0/0</b><span data-i18n="st_lessons"></span></div>
      <div class="hstat"><b id="st-quiz">—</b><span data-i18n="st_quiz"></span></div>
      <div class="hstat"><b id="st-notes">0</b><span data-i18n="st_notes"></span></div>
    </div>
  </div>
  <h2 class="sec-title" data-i18n="home_courses"></h2>
  <div class="grid" id="courseGrid"></div>
  <h2 class="sec-title" data-i18n="home_tools"></h2>
  <div class="grid" id="toolsGrid"></div>
</section>

<!-- COURSES -->
<section class="page" id="page-courses">
  <h2 class="sec-title" data-i18n="courses_title"></h2>
  <div class="search-bar"><input class="search-input" id="courseSearch" data-i18n-ph="search_ph"></div>
  <div class="grid" id="courseGridFull"></div>
</section>

<!-- LESSON -->
<section class="page" id="page-lesson"><div class="lesson-wrap" id="lessonContent"></div></section>

<!-- CALC -->
<section class="page" id="page-calc">
  <h2 class="sec-title" data-i18n="calc_title"></h2>
  <div class="tabs" id="calcTabs"></div>
  <div id="calcPanels"></div>
</section>

<!-- PLOT -->
<section class="page" id="page-plot">
  <h2 class="sec-title" data-i18n="plot_title"></h2>
  <div class="panel active">
    <div class="inp-grid">
      <div class="inp-row"><label>f(x) =</label><input class="inp" id="p-func" value="sin(x)"></div>
      <div class="inp-row"><label data-i18n="plot_xmin"></label><input class="inp" id="p-xmin" value="-10" style="max-width:100px">
      <label data-i18n="plot_xmax"></label><input class="inp" id="p-xmax" value="10" style="max-width:100px"></div>
    </div>
    <button class="btn" onclick="drawPlot()" data-i18n="plot_btn"></button>
    <canvas class="plot-canvas" id="plotCanvas" style="margin-top:18px"></canvas>
    <div class="result" id="plot-info" style="margin-top:16px"></div>
  </div>
</section>

<!-- QUIZ -->
<section class="page" id="page-quiz">
  <h2 class="sec-title" data-i18n="quiz_title"></h2>
  <div id="quizArea"></div>
</section>

<!-- NOTES -->
<section class="page" id="page-notes">
  <h2 class="sec-title" data-i18n="notes_title"></h2>
  <div class="panel active">
    <p style="color:var(--muted);margin-bottom:14px" data-i18n="notes_sub"></p>
    <textarea class="notes-area" id="notesArea" data-i18n-ph="notes_ph"></textarea>
    <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
      <button class="btn" onclick="saveNotes()" data-i18n="notes_save"></button>
      <button class="btn btn-sec" onclick="exportNotes()" data-i18n="notes_export"></button>
      <button class="btn btn-sec" onclick="document.getElementById('importFile').click()" data-i18n="notes_import"></button>
      <input type="file" id="importFile" accept=".json,.txt" style="display:none" onchange="importNotes(this)">
    </div>
    <p style="margin-top:14px;font-size:13px;color:var(--muted)" data-i18n="notes_cookie"></p>
  </div>
</section>

<!-- LIFEHACKS -->
<section class="page" id="page-hacks">
  <h2 class="sec-title" data-i18n="hacks_title"></h2>
  <p class="sec-sub" data-i18n="hacks_sub"></p>
  <div class="grid" id="hacksGrid"></div>
</section>

<!-- BONUS -->
<section class="page" id="page-bonus">
  <h2 class="sec-title" data-i18n="bonus_title"></h2>
  <div class="grid" id="bonusGrid"></div>
</section>

</main>

<footer class="footer">Math Universe © 2025 · <span data-i18n="footer"></span></footer>
<div class="toast" id="toast"></div>

<script>

 {icon:'📐',title:{ru:'Функции и их свойства',kz:'Функциялар және олардың қасиеттері',en:'Functions and their properties'},
  content:{
   ru:`<p><b>На пальцах:</b> Функция — «мясорубка»: кидаешь x, получаешь y. Одному x — строго один y.</p>
<div class="formula-box">$$y=f(x),\\quad D(f)\\to E(f)$$</div>
<h4>Ключевые свойства</h4><ol>
<li><b>Чётность:</b> f(−x)=f(x) — симметрия относительно оси Y (пример: x², cos x).</li>
<li><b>Нечётность:</b> f(−x)=−f(x) — симметрия относительно начала координат (x³, sin x).</li>
<li><b>Монотонность:</b> возрастание/убывание.</li>
<li><b>Периодичность:</b> f(x+T)=f(x); у sin и cos T=2π.</li>
<li><b>Ограниченность:</b> |f(x)|≤M.</li></ol>
<div class="example-box"><b>Пример:</b> f(x)=3x²−2x+1, найти f(5): 3·25−10+1 = 66.</div>
<h4>Преобразования графиков</h4><ul>
<li>f(x)+c — сдвиг вверх на c</li>
<li>f(x−c) — сдвиг вправо на c</li>
<li>−f(x) — отражение от оси X</li>
<li>f(−x) — отражение от оси Y</li>
<li>|f(x)| — отрицательная часть загибается вверх</li></ul>`,
   kz:`<p><b>Қарапайым тілмен:</b> Функция — «ет тартқыш»: x саласың, y аласың. Бір x-ке тек бір y сәйкес келеді.</p>
<div class="formula-box">$$y=f(x),\\quad D(f)\\to E(f)$$</div>
<h4>Негізгі қасиеттер</h4><ol>
<li><b>Жұптық:</b> f(−x)=f(x) — Y осіне қатысты симметрия (мысалы: x², cos x).</li>
<li><b>Тақтық:</b> f(−x)=−f(x) — координат басына қатысты симметрия (x³, sin x).</li>
<li><b>Монотондылық:</b> өсу/кему.</li>
<li><b>Периодтылық:</b> f(x+T)=f(x); sin және cos үшін T=2π.</li>
<li><b>Шектелгендік:</b> |f(x)|≤M.</li></ol>
<div class="example-box"><b>Мысал:</b> f(x)=3x²−2x+1, f(5) табу: 3·25−10+1 = 66.</div>
<h4>График түрлендірулері</h4><ul>
<li>f(x)+c — c-ге жоғары жылжыту</li>
<li>f(x−c) — c-ге оңға жылжыту</li>
<li>−f(x) — X осіне қатысты шағылыстыру</li>
<li>f(−x) — Y осіне қатысты шағылыстыру</li>
<li>|f(x)| — теріс бөлігі жоғары иіледі</li></ul>`,
   en:`<p><b>In simple terms:</b> A function is a "machine": feed in x, get y. Each x maps to exactly one y.</p>
<div class="formula-box">$$y=f(x),\\quad D(f)\\to E(f)$$</div>
<h4>Key properties</h4><ol>
<li><b>Even:</b> f(−x)=f(x) — symmetric about Y-axis (e.g. x², cos x).</li>
<li><b>Odd:</b> f(−x)=−f(x) — symmetric about origin (x³, sin x).</li>
<li><b>Monotonicity:</b> increasing/decreasing.</li>
<li><b>Periodicity:</b> f(x+T)=f(x); for sin and cos T=2π.</li>
<li><b>Boundedness:</b> |f(x)|≤M.</li></ol>
<div class="example-box"><b>Example:</b> f(x)=3x²−2x+1, find f(5): 3·25−10+1 = 66.</div>
<h4>Graph transformations</h4><ul>
<li>f(x)+c — shift up by c</li>
<li>f(x−c) — shift right by c</li>
<li>−f(x) — reflect about X-axis</li>
<li>f(−x) — reflect about Y-axis</li>
<li>|f(x)| — negative part folds upward</li></ul>`}},

<tr><td style="padding:8px;border:1px solid var(--border);text-align:center">45</td><td style="text-align:center;border:1px solid var(--border)">√2/2</td><td style="text-align:center;border:1px solid var(--border)">√2/2</td><td style="text-align:center;border:1px solid var(--border)">1</td></tr>
<tr><td style="padding:8px;border:1px solid var(--border);text-align:center">60</td><td style="text-align:center;border:1px solid var(--border)">√3/2</td><td style="text-align:center;border:1px solid var(--border)">1/2</td><td style="text-align:center;border:1px solid var(--border)">√3</td></tr>
<tr><td style="padding:8px;border:1px solid var(--border);text-align:center">90</td><td style="text-align:center;border:1px solid var(--border)">1</td><td style="text-align:center;border:1px solid var(--border)">0</td><td style="text-align:center;border:1px solid var(--border)">∞</td></tr></table>
<div class="tip-box"> Есте сақтау: sin = Қарсы жатқан/Гипотенуза, cos = Іргелес/Гипотенуза, tan = Қарсы жатқан/Іргелес.</div>
<h4>Қосу формулалары</h4>
<div class="formula-box">$$\\sin(\\alpha\\pm\\beta)=\\sin\\alpha\\cos\\beta\\pm\\cos\\alpha\\sin\\beta$$<br>$$\\cos(\\alpha\\pm\\beta)=\\cos\\alpha\\cos\\beta\\mp\\sin\\alpha\\sin\\beta$$</div>`,
   en:`<p><b>In simple terms:</b> Trigonometry is about angles in a right triangle and the unit circle.</p>
<div class="formula-box">$$\\sin^2\\alpha+\\cos^2\\alpha=1\\qquad\\tan\\alpha=\\frac{\\sin\\alpha}{\\cos\\alpha}$$<br>$$\\sin 2\\alpha=2\\sin\\alpha\\cos\\alpha$$</div>
<h4>Values table</h4>
<table style="width:100%;border-collapse:collapse;margin:10px 0;font-size:14px">
<tr style="background:var(--surface2)"><th style="padding:8px;border:1px solid var(--border)">°</th><th style="padding:8px;border:1px solid var(--border)">sin</th><th style="padding:8px;border:1px solid var(--border)">cos</th><th style="padding:8px;border:1px solid var(--border)">tan</th></tr>
<tr><td style="padding:8px;border:1px solid var(--border);text-align:center">0</td><td style="text-align:center;border:1px solid var(--border)">0</td><td style="text-align:center;border:1px solid var(--border)">1</td><td style="text-align:center;border:1px solid var(--border)">0</td></tr>
<tr><td style="padding:8px;border:1px solid var(--border);text-align:center">30</td><td style="text-align:center;border:1px solid var(--border)">1/2</td><td style="text-align:center;border:1px solid var(--border)">√3/2</td><td style="text-align:center;border:1px solid var(--border)">1/√3</td></tr>
<tr><td style="padding:8px;border:1px solid var(--border);text-align:center">45</td><td style="text-align:center;border:1px solid var(--border)">√2/2</td><td style="text-align:center;border:1px solid var(--border)">√2/2</td><td style="text-align:center;border:1px solid var(--border)">1</td></tr>
<tr><td style="padding:8px;border:1px solid var(--border);text-align:center">60</td><td style="text-align:center;border:1px solid var(--border)">√3/2</td><td style="text-align:center;border:1px solid var(--border)">1/2</td><td style="text-align:center;border:1px solid var(--border)">√3</td></tr>
<tr><td style="padding:8px;border:1px solid var(--border);text-align:center">90</td><td style="text-align:center;border:1px solid var(--border)">1</td><td style="text-align:center;border:1px solid var(--border)">0</td><td style="text-align:center;border:1px solid var(--border)">∞</td></tr></table>
<div class="tip-box">Mnemonic: sin = Opposite/Hypotenuse, cos = Adjacent/Hypotenuse, tan = Opposite/Adjacent.</div>
<h4>Addition formulas</h4>
<div class="formula-box">$$\\sin(\\alpha\\pm\\beta)=\\sin\\alpha\\cos\\beta\\pm\\cos\\alpha\\sin\\beta$$<br>$$\\cos(\\alpha\\pm\\beta)=\\cos\\alpha\\cos\\beta\\mp\\sin\\alpha\\sin\\beta$$</div>`}},
 {icon:'🔢',title:{ru:'Логарифмы и экспоненты',kz:'Логарифмдер және экспонента',en:'Logarithms and exponentials'},
  content:{
   ru:`<p><b>На пальцах:</b> Логарифм — обратная операция к возведению в степень. log₂(8)=3, потому что 2³=8.</p>
<div class="formula-box">$$\\log_a b=c\\Leftrightarrow a^c=b$$<br>$$\\log(ab)=\\log a+\\log b\\qquad\\log\\frac{a}{b}=\\log a-\\log b$$<br>$$\\log a^n=n\\log a$$</div>
<h4>Свойства</h4><ul>
<li>log_a(1)=0, log_a(a)=1, log_a(aⁿ)=n</li>
<li>Формула перехода: \\(\\log_a b=\\frac{\\ln b}{\\ln a}\\)</li></ul>
<h4>Число e</h4>
<p>e ≈ 2.71828… — основание натурального логарифма, появляется при непрерывном росте:</p>
<div class="formula-box">$$e=\\lim_{n\\to\\infty}\\left(1+\\frac{1}{n}\\right)^n$$</div>
<div class="tip-box">Экспонента — единственная функция, равная своей производной: (eˣ)′=eˣ. Поэтому она всюду: распад, проценты, популяции.</div>`,
   kz:`<p><b>Қарапайым тілмен:</b> Логарифм — дәрежеге шығаруға кері амал. log₂(8)=3, өйткені 2³=8.</p>
<div class="formula-box">$$\\log_a b=c\\Leftrightarrow a^c=b$$<br>$$\\log(ab)=\\log a+\\log b\\qquad\\log\\frac{a}{b}=\\log a-\\log b$$<br>$$\\log a^n=n\\log a$$</div>
<h4>Қасиеттері</h4><ul>
<li>log_a(1)=0, log_a(a)=1, log_a(aⁿ)=n</li>
<li>Негізді ауыстыру формуласы: \\(\\log_a b=\\frac{\\ln b}{\\ln a}\\)</li></ul>
<h4>e саны</h4>
<p>e ≈ 2.71828… — натурал логарифмнің негізі, үздіксіз өсу кезінде пайда болады:</p>
<div class="formula-box">$$e=\\lim_{n\\to\\infty}\\left(1+\\frac{1}{n}\\right)^n$$</div>
<div class="tip-box">Экспонента — өз туындысына тең жалғыз функция: (eˣ)′=eˣ. Сондықтан ол бәрінде бар: ыдырау, пайыз, популяция.</div>`,
   en:`<p><b>In simple terms:</b> A logarithm is the inverse of exponentiation. log₂(8)=3 because 2³=8.</p>
<div class="formula-box">$$\\log_a b=c\\Leftrightarrow a^c=b$$<br>$$\\log(ab)=\\log a+\\log b\\qquad\\log\\frac{a}{b}=\\log a-\\log b$$<br>$$\\log a^n=n\\log a$$</div>
<h4>Properties</h4><ul>
<li>log_a(1)=0, log_a(a)=1, log_a(aⁿ)=n</li>
<li>Change of base: \\(\\log_a b=\\frac{\\ln b}{\\ln a}\\)</li></ul>
<h4>The number e</h4>
<p>e ≈ 2.71828… — the base of the natural logarithm, appears in continuous growth:</p>
<div class="formula-box">$$e=\\lim_{n\\to\\infty}\\left(1+\\frac{1}{n}\\right)^n$$</div>
<div class="tip-box">The exponential is the only function equal to its own derivative: (eˣ)′=eˣ. That's why it's everywhere: decay, interest, populations.</div>`}}
],
algebra:[
 {icon:'📉',title:{ru:'Квадратные уравнения',kz:'Квадрат теңдеулер',en:'Quadratic equations'},
  content:{
   ru:`<p><b>На пальцах:</b> Уравнение с иксом в квадрате. Корней 0, 1 или 2 — решает дискриминант.</p>
<div class="formula-box">$$ax^2+bx+c=0,\\quad D=b^2-4ac,\\quad x_{1,2}=\\frac{-b\\pm\\sqrt{D}}{2a}$$</div>
<h4>Алгоритм</h4><ol>
<li>Запиши коэффициенты a, b, c.</li>
<li>Вычисли D = b²−4ac.</li>
<li>D&lt;0 — нет вещественных корней; D=0 — один; D&gt;0 — два.</li>
<li>Подставь в формулу.</li></ol>
<h4>Теорема Виета</h4>
<div class="formula-box">$$x_1+x_2=-\\frac{b}{a},\\qquad x_1 x_2=\\frac{c}{a}$$</div>
<div class="tip-box">Часто быстрее подобрать корни через сумму и произведение, чем считать дискриминант!</div>
<h4>Разложение на множители</h4>
<p>Если x₁, x₂ — корни, то \\(ax^2+bx+c=a(x-x_1)(x-x_2)\\).</p>`,
   kz:`<p><b>Қарапайым тілмен:</b> Икс квадраты бар теңдеу. Түбірлері 0, 1 немесе 2 — оны дискриминант анықтайды.</p>
<div class="formula-box">$$ax^2+bx+c=0,\\quad D=b^2-4ac,\\quad x_{1,2}=\\frac{-b\\pm\\sqrt{D}}{2a}$$</div>
<h4>Алгоритм</h4><ol>
<li>Коэффициенттерді жаз: a, b, c.</li>
<li>D = b²−4ac есепте.</li>
<li>D&lt;0 — нақты түбір жоқ; D=0 — бір; D&gt;0 — екі.</li>
<li>Формулаға қой.</li></ol>
<h4>Виет теоремасы</h4>
<div class="formula-box">$$x_1+x_2=-\\frac{b}{a},\\qquad x_1 x_2=\\frac{c}{a}$$</div>
<div class="tip-box">Көбіне дискриминантты есептегенше, қосынды мен көбейтінді арқылы түбірлерді табу жылдам!</div>
<h4>Көбейткіштерге жіктеу</h4>
<p>Егер x₁, x₂ — түбірлер болса, \\(ax^2+bx+c=a(x-x_1)(x-x_2)\\).</p>`,
   en:`<p><b>In simple terms:</b> An equation with x squared. It has 0, 1 or 2 roots — decided by the discriminant.</p>
<div class="formula-box">$$ax^2+bx+c=0,\\quad D=b^2-4ac,\\quad x_{1,2}=\\frac{-b\\pm\\sqrt{D}}{2a}$$</div>
<h4>Algorithm</h4><ol>
<li>Write down coefficients a, b, c.</li>
<li>Compute D = b²−4ac.</li>
<li>D&lt;0 — no real roots; D=0 — one; D&gt;0 — two.</li>
<li>Plug into the formula.</li></ol>
<h4>Vieta's theorem</h4>
<div class="formula-box">$$x_1+x_2=-\\frac{b}{a},\\qquad x_1 x_2=\\frac{c}{a}$$</div>
<div class="tip-box">Often it's faster to find roots via sum and product than computing the discriminant!</div>
<h4>Factorization</h4>
<p>If x₁, x₂ are roots, then \\(ax^2+bx+c=a(x-x_1)(x-x_2)\\).</p>`}},
 {icon:'📋',title:{ru:'Системы уравнений',kz:'Теңдеулер жүйелері',en:'Systems of equations'},
  content:{
   ru:`<p><b>На пальцах:</b> Несколько уравнений — найти значения переменных одновременно.</p>
<div class="formula-box">$$\\begin{cases}2x+y=5\\\\x-y=1\\end{cases}\\Rightarrow x=2,\\;y=1$$</div>
<h4>Методы</h4><ol>
<li><b>Подстановка:</b> выразить одну переменную и подставить.</li>
<li><b>Сложение:</b> умножить так, чтобы переменная сократилась.</li>
<li><b>Графический:</b> точка пересечения прямых.</li>
<li><b>Матричный:</b> Крамер / обратная матрица.</li></ol>`,
   kz:`<p><b>Қарапайым тілмен:</b> Бірнеше теңдеу — айнымалылардың мәндерін бір мезгілде табу.</p>
<div class="formula-box">$$\\begin{cases}2x+y=5\\\\x-y=1\\end{cases}\\Rightarrow x=2,\\;y=1$$</div>
<h4>Әдістер</h4><ol>
<li><b>Алмастыру:</b> бір айнымалыны өрнектеп, қою.</li>
<li><b>Қосу:</b> айнымалы қысқаратындай етіп көбейту.</li>
<li><b>Графиктік:</b> түзулердің қиылысу нүктесі.</li>
<li><b>Матрицалық:</b> Крамер / кері матрица.</li></ol>`,
   en:`<p><b>In simple terms:</b> Several equations — find the variables' values simultaneously.</p>
<div class="formula-box">$$\\begin{cases}2x+y=5\\\\x-y=1\\end{cases}\\Rightarrow x=2,\\;y=1$$</div>
<h4>Methods</h4><ol>
<li><b>Substitution:</b> express one variable and substitute.</li>
<li><b>Elimination:</b> multiply so a variable cancels.</li>
<li><b>Graphical:</b> intersection point of the lines.</li>
<li><b>Matrix:</b> Cramer's rule / inverse matrix.</li></ol>`}},
 {icon:'🎯',title:{ru:'Неравенства',kz:'Теңсіздіктер',en:'Inequalities'},
  content:{
   ru:`<p><b>На пальцах:</b> Как уравнение, но со знаками &lt;, ≤, &gt;, ≥. При умножении на отрицательное знак меняется!</p>
<div class="formula-box">$$x^2-5x+6>0\\Rightarrow(x-2)(x-3)>0\\Rightarrow x\\in(-\\infty;2)\\cup(3;+\\infty)$$</div>
<h4>Метод интервалов</h4><ol>
<li>Найди корни f(x)=0.</li>
<li>Отметь на числовой оси.</li>
<li>Проверь знак в каждом интервале.</li>
<li>Выбери интервалы с нужным знаком.</li></ol>
<div class="warn-box">При умножении/делении на отрицательное число знак неравенства ОБЯЗАТЕЛЬНО меняется!</div>`,
   kz:`<p><b>Қарапайым тілмен:</b> Теңдеу сияқты, бірақ &lt;, ≤, &gt;, ≥ таңбаларымен. Теріс санға көбейткенде таңба өзгереді!</p>
<div class="formula-box">$$x^2-5x+6>0\\Rightarrow(x-2)(x-3)>0\\Rightarrow x\\in(-\\infty;2)\\cup(3;+\\infty)$$</div>
<h4>Интервалдар әдісі</h4><ol>
<li>f(x)=0 түбірлерін тап.</li>
<li>Сан түзуінде белгіле.</li>
<li>Әр интервалдағы таңбаны тексер.</li>
<li>Қажетті таңбалы интервалдарды таңда.</li></ol>
<div class="warn-box">Теріс санға көбейткенде/бөлгенде теңсіздік таңбасы МІНДЕТТІ түрде өзгереді!</div>`,
   en:`<p><b>In simple terms:</b> Like an equation, but with &lt;, ≤, &gt;, ≥. Multiplying by a negative flips the sign!</p>
<div class="formula-box">$$x^2-5x+6>0\\Rightarrow(x-2)(x-3)>0\\Rightarrow x\\in(-\\infty;2)\\cup(3;+\\infty)$$</div>
<h4>Interval method</h4><ol>
<li>Find roots of f(x)=0.</li>
<li>Mark them on the number line.</li>
<li>Check the sign in each interval.</li>
<li>Pick intervals with the needed sign.</li></ol>
<div class="warn-box">When multiplying/dividing by a negative, the inequality sign MUST flip!</div>`}}
],
calc:[
 {icon:'🔭',title:{ru:'Пределы функций',kz:'Функция шектері',en:'Limits of functions'},
  content:{
   ru:`<p><b>На пальцах:</b> Предел — значение, к которому функция стремится при x→a.</p>
<div class="formula-box">$$\\lim_{x\\to a}f(x)=L$$<br>$$\\lim_{x\\to 0}\\frac{\\sin x}{x}=1\\quad(\\text{Первый замечательный})$$<br>$$\\lim_{x\\to\\infty}\\left(1+\\frac{1}{x}\\right)^x=e\\quad(\\text{Второй замечательный})$$</div>
<h4>Правило Лопиталя</h4><ol>
<li>Убедись в форме 0/0 или ∞/∞.</li>
<li>Возьми производные числителя и знаменателя раздельно.</li>
<li>Вычисли предел нового отношения.</li></ol>
<div class="tip-box">0·∞ → перепиши как 0/(1/∞) и применяй Лопиталя. ∞−∞ → приведи к общему знаменателю.</div>`,
   kz:`<p><b>Қарапайым тілмен:</b> Шек — функцияның x→a кезінде ұмтылатын мәні.</p>
<div class="formula-box">$$\\lim_{x\\to a}f(x)=L$$<br>$$\\lim_{x\\to 0}\\frac{\\sin x}{x}=1\\quad(\\text{Бірінші тамаша шек})$$<br>$$\\lim_{x\\to\\infty}\\left(1+\\frac{1}{x}\\right)^x=e\\quad(\\text{Екінші тамаша шек})$$</div>
<h4>Лопиталь ережесі</h4><ol>
<li>0/0 немесе ∞/∞ түрінде екенін тексер.</li>
<li>Алым мен бөлімнің туындыларын бөлек ал.</li>
<li>Жаңа қатынастың шегін есепте.</li></ol>
<div class="tip-box">0·∞ → 0/(1/∞) түрінде қайта жаз да Лопитальді қолдан. ∞−∞ → ортақ бөлімге келтір.</div>`,
   en:`<p><b>In simple terms:</b> A limit is the value a function approaches as x→a.</p>
<div class="formula-box">$$\\lim_{x\\to a}f(x)=L$$<br>$$\\lim_{x\\to 0}\\frac{\\sin x}{x}=1\\quad(\\text{First remarkable limit})$$<br>$$\\lim_{x\\to\\infty}\\left(1+\\frac{1}{x}\\right)^x=e\\quad(\\text{Second remarkable limit})$$</div>
<h4>L'Hôpital's rule</h4><ol>
<li>Confirm the 0/0 or ∞/∞ form.</li>
<li>Differentiate numerator and denominator separately.</li>
<li>Compute the limit of the new ratio.</li></ol>
<div class="tip-box">0·∞ → rewrite as 0/(1/∞) and apply L'Hôpital. ∞−∞ → combine into a common denominator.</div>`}},
 {icon:'📈',title:{ru:'Производная',kz:'Туынды',en:'Derivative'},
  content:{
   ru:`<p><b>На пальцах:</b> Производная — мгновенная скорость изменения. Спидометр движения.</p>
<div class="formula-box">$$f'(x)=\\lim_{\\Delta x\\to 0}\\frac{f(x+\\Delta x)-f(x)}{\\Delta x}$$<br>$$(x^n)'=nx^{n-1}\\qquad(\\sin x)'=\\cos x$$<br>$$(e^x)'=e^x\\qquad(\\ln x)'=\\frac{1}{x}$$</div>
<h4>Правила</h4><ul>
<li><b>Сумма:</b> (u±v)′=u′±v′</li>
<li><b>Произведение:</b> (uv)′=u′v+uv′</li>
<li><b>Частное:</b> (u/v)′=(u′v−uv′)/v²</li>
<li><b>Сложная:</b> (f(g(x)))′=f′(g(x))·g′(x)</li></ul>
<h4>Исследование функции</h4><ol>
<li>f′(x)=0 → критические точки.</li>
<li>f″(x)&gt;0 → минимум, f″(x)&lt;0 → максимум.</li>
<li>f″(x)=0 → точки перегиба.</li></ol>
<div class="tip-box">Геометрически производная — тангенс угла наклона касательной к графику.</div>`,
   kz:`<p><b>Қарапайым тілмен:</b> Туынды — өзгерістің лездік жылдамдығы. Қозғалыстың спидометрі.</p>
<div class="formula-box">$$f'(x)=\\lim_{\\Delta x\\to 0}\\frac{f(x+\\Delta x)-f(x)}{\\Delta x}$$<br>$$(x^n)'=nx^{n-1}\\qquad(\\sin x)'=\\cos x$$<br>$$(e^x)'=e^x\\qquad(\\ln x)'=\\frac{1}{x}$$</div>
<h4>Ережелер</h4><ul>
<li><b>Қосынды:</b> (u±v)′=u′±v′</li>
<li><b>Көбейтінді:</b> (uv)′=u′v+uv′</li>
<li><b>Бөлшек:</b> (u/v)′=(u′v−uv′)/v²</li>
<li><b>Күрделі:</b> (f(g(x)))′=f′(g(x))·g′(x)</li></ul>
<h4>Функцияны зерттеу</h4><ol>
<li>f′(x)=0 → критикалық нүктелер.</li>
<li>f″(x)&gt;0 → минимум, f″(x)&lt;0 → максимум.</li>
<li>f″(x)=0 → иілу нүктелері.</li></ol>
<div class="tip-box">Геометриялық тұрғыдан туынды — графикке жүргізілген жанаманың еңіс бұрышының тангенсі.</div>`,
   en:`<p><b>In simple terms:</b> The derivative is the instantaneous rate of change. The speedometer of motion.</p>
<div class="formula-box">$$f'(x)=\\lim_{\\Delta x\\to 0}\\frac{f(x+\\Delta x)-f(x)}{\\Delta x}$$<br>$$(x^n)'=nx^{n-1}\\qquad(\\sin x)'=\\cos x$$<br>$$(e^x)'=e^x\\qquad(\\ln x)'=\\frac{1}{x}$$</div>
<h4>Rules</h4><ul>
<li><b>Sum:</b> (u±v)′=u′±v′</li>
<li><b>Product:</b> (uv)′=u′v+uv′</li>
<li><b>Quotient:</b> (u/v)′=(u′v−uv′)/v²</li>
<li><b>Chain:</b> (f(g(x)))′=f′(g(x))·g′(x)</li></ul>
<h4>Function analysis</h4><ol>
<li>f′(x)=0 → critical points.</li>
<li>f″(x)&gt;0 → minimum, f″(x)&lt;0 → maximum.</li>
<li>f″(x)=0 → inflection points.</li></ol>
<div class="tip-box">Geometrically, the derivative is the slope (tangent of angle) of the tangent line to the graph.</div>`}},
 {icon:'∫',title:{ru:'Интегралы',kz:'Интегралдар',en:'Integrals'},
  content:{
   ru:`<p><b>На пальцах:</b> Интеграл — обратная операция к производной. Определённый — площадь под кривой.</p>
<div class="formula-box">$$\\int x^n dx=\\frac{x^{n+1}}{n+1}+C,\\;n\\neq-1$$<br>$$\\int\\sin x\\,dx=-\\cos x+C\\qquad\\int e^x dx=e^x+C$$<br>$$\\int_a^b f(x)dx=F(b)-F(a)\\quad(\\text{Ньютон-Лейбниц})$$</div>
<h4>Метод замены переменной</h4><ol>
<li>Выбери t = g(x).</li>
<li>Найди dt = g′(x)dx.</li>
<li>Замени всё через t.</li>
<li>Интегрируй, вернись к x.</li></ol>
<h4>Интегрирование по частям</h4>
<div class="formula-box">$$\\int u\\,dv=uv-\\int v\\,du$$</div>
<div class="tip-box">LIATE: u = Логарифм → Арктриг → Многочлен → Триг → Экспонента. Первое из списка!</div>`,
   kz:`<p><b>Қарапайым тілмен:</b> Интеграл — туындыға кері амал. Анықталған интеграл — қисық астындағы аудан.</p>
<div class="formula-box">$$\\int x^n dx=\\frac{x^{n+1}}{n+1}+C,\\;n\\neq-1$$<br>$$\\int\\sin x\\,dx=-\\cos x+C\\qquad\\int e^x dx=e^x+C$$<br>$$\\int_a^b f(x)dx=F(b)-F(a)\\quad(\\text{Ньютон-Лейбниц})$$</div>
<h4>Айнымалыны алмастыру әдісі</h4><ol>
<li>t = g(x) таңда.</li>
<li>dt = g′(x)dx тап.</li>
<li>Бәрін t арқылы алмастыр.</li>
<li>Интегралда, x-ке қайт.</li></ol>
<h4>Бөліктеп интегралдау</h4>
<div class="formula-box">$$\\int u\\,dv=uv-\\int v\\,du$$</div>
<div class="tip-box">LIATE: u = Логарифм → Арктриг → Көпмүше → Триг → Экспонента. Тізімдегі бірінші!</div>`,
   en:`<p><b>In simple terms:</b> The integral is the inverse of the derivative. The definite integral is the area under the curve.</p>
<div class="formula-box">$$\\int x^n dx=\\frac{x^{n+1}}{n+1}+C,\\;n\\neq-1$$<br>$$\\int\\sin x\\,dx=-\\cos x+C\\qquad\\int e^x dx=e^x+C$$<br>$$\\int_a^b f(x)dx=F(b)-F(a)\\quad(\\text{Newton-Leibniz})$$</div>
<h4>Substitution method</h4><ol>
<li>Choose t = g(x).</li>
<li>Find dt = g′(x)dx.</li>
<li>Substitute everything in terms of t.</li>
<li>Integrate, return to x.</li></ol>
<h4>Integration by parts</h4>
<div class="formula-box">$$\\int u\\,dv=uv-\\int v\\,du$$</div>
<div class="tip-box">LIATE: u = Log → Inverse trig → Polynomial → Trig → Exponential. First one in the list!</div>`}},
 {icon:'🌐',title:{ru:'Частные производные',kz:'Дербес туындылар',en:'Partial derivatives'},
  content:{
   ru:`<p><b>На пальцах:</b> Частная производная — как меняется функция двух переменных вдоль одной оси.</p>
<div class="formula-box">$$z=f(x,y)\\qquad\\frac{\\partial z}{\\partial x}=f'_x\\;(y\\text{ const})\\qquad\\frac{\\partial z}{\\partial y}=f'_y\\;(x\\text{ const})$$<br>$$\\iint_D f(x,y)\\,dx\\,dy\\quad—\\quad\\text{объём под поверхностью}$$</div>
<h4>Градиент</h4>
<p>$$\\nabla f=\\left(\\frac{\\partial f}{\\partial x},\\frac{\\partial f}{\\partial y}\\right)$$</p>
<p>Градиент указывает направление <b>наибольшего роста</b> функции.</p>
<div class="tip-box">В машинном обучении градиентный спуск — движение <i>против</i> градиента для минимизации функции потерь.</div>`,
   kz:`<p><b>Қарапайым тілмен:</b> Дербес туынды — екі айнымалы функцияның бір ось бойымен қалай өзгеретіні.</p>
<div class="formula-box">$$z=f(x,y)\\qquad\\frac{\\partial z}{\\partial x}=f'_x\\;(y\\text{ тұрақты})\\qquad\\frac{\\partial z}{\\partial y}=f'_y\\;(x\\text{ тұрақты})$$<br>$$\\iint_D f(x,y)\\,dx\\,dy\\quad—\\quad\\text{бет астындағы көлем}$$</div>
<h4>Градиент</h4>
<p>$$\\nabla f=\\left(\\frac{\\partial f}{\\partial x},\\frac{\\partial f}{\\partial y}\\right)$$</p>
<p>Градиент функцияның <b>ең үлкен өсу</b> бағытын көрсетеді.</p>
<div class="tip-box">Машиналық оқытуда градиенттік спуск — шығын функциясын азайту үшін градиентке <i>қарсы</i> қозғалыс.</div>`,
   en:`<p><b>In simple terms:</b> A partial derivative shows how a function of two variables changes along one axis.</p>
<div class="formula-box">$$z=f(x,y)\\qquad\\frac{\\partial z}{\\partial x}=f'_x\\;(y\\text{ const})\\qquad\\frac{\\partial z}{\\partial y}=f'_y\\;(x\\text{ const})$$<br>$$\\iint_D f(x,y)\\,dx\\,dy\\quad—\\quad\\text{volume under the surface}$$</div>
<h4>Gradient</h4>
<p>$$\\nabla f=\\left(\\frac{\\partial f}{\\partial x},\\frac{\\partial f}{\\partial y}\\right)$$</p>
<p>The gradient points in the direction of <b>steepest ascent</b> of the function.</p>
<div class="tip-box">In machine learning, gradient descent moves <i>against</i> the gradient to minimize the loss function.</div>`}},
 {icon:'〰️',title:{ru:'Дифференциальные уравнения',kz:'Дифференциалдық теңдеулер',en:'Differential equations'},
  content:{
   ru:`<p><b>На пальцах:</b> ДУ — ищем функцию, а не число. Описывают физику, биологию, экономику.</p>
<div class="formula-box">$$y'+p(x)y=q(x)\\quad(\\text{Линейное 1-го порядка})$$<br>$$\\frac{dy}{dx}=f(x)g(y)\\quad(\\text{С разделяющимися переменными})$$</div>
<h4>Разделение переменных</h4><ol>
<li>Перенеси y на одну сторону, x на другую.</li>
<li>Запиши: g(y)dy = f(x)dx.</li>
<li>Интегрируй обе части.</li>
<li>Выдели y. Найди C из начального условия.</li></ol>
<h4>Пример: рост популяции</h4>
<p>$$\\frac{dN}{dt}=kN\\Rightarrow N(t)=N_0 e^{kt}$$</p>
<div class="tip-box">ДУ 2-го порядка описывают колебания: маятник, электрический контур, волны.</div>`,
   kz:`<p><b>Қарапайым тілмен:</b> ДТ — сан емес, функция іздейміз. Физика, биология, экономика сипаттайды.</p>
<div class="formula-box">$$y'+p(x)y=q(x)\\quad(\\text{1-ші ретті сызықтық})$$<br>$$\\frac{dy}{dx}=f(x)g(y)\\quad(\\text{Айнымалылары ажыратылатын})$$</div>
<h4>Айнымалыларды ажырату</h4><ol>
<li>y-ті бір жаққа, x-ті екінші жаққа көшір.</li>
<li>Жаз: g(y)dy = f(x)dx.</li>
<li>Екі жағын да интегралда.</li>
<li>y-ті бөл. Бастапқы шарттан C тап.</li></ol>
<h4>Мысал: популяция өсуі</h4>
<p>$$\\frac{dN}{dt}=kN\\Rightarrow N(t)=N_0 e^{kt}$$</p>
<div class="tip-box">2-ші ретті ДТ тербелістерді сипаттайды: маятник, электр тізбегі, толқындар.</div>`,
   en:`<p><b>In simple terms:</b> In DEs we seek a function, not a number. They describe physics, biology, economics.</p>
<div class="formula-box">$$y'+p(x)y=q(x)\\quad(\\text{First-order linear})$$<br>$$\\frac{dy}{dx}=f(x)g(y)\\quad(\\text{Separable})$$</div>
<h4>Separation of variables</h4><ol>
<li>Move y to one side, x to the other.</li>
<li>Write: g(y)dy = f(x)dx.</li>
<li>Integrate both sides.</li>
<li>Solve for y. Find C from the initial condition.</li></ol>
<h4>Example: population growth</h4>
<p>$$\\frac{dN}{dt}=kN\\Rightarrow N(t)=N_0 e^{kt}$$</p>
<div class="tip-box">Second-order DEs describe oscillations: pendulum, electric circuit, waves.</div>`}}
],
linal:[
 {icon:'📊',title:{ru:'Матрицы и операции',kz:'Матрицалар және амалдар',en:'Matrices and operations'},
  content:{
   ru:`<p><b>На пальцах:</b> Матрица — таблица чисел. Сжимает/поворачивает пространство.</p>
<div class="formula-box">$$A=\\begin{pmatrix}a_{11}&a_{12}\\\\a_{21}&a_{22}\\end{pmatrix}\\qquad(AB)_{ij}=\\sum_k a_{ik}b_{kj}$$</div>
<h4>Умножение матриц</h4><ol>
<li>Число столбцов A = число строк B.</li>
<li>Строку A умножай на столбец B поэлементно и складывай.</li>
<li>AB ≠ BA! Порядок важен!</li></ol>
<p><b>Транспонирование</b> — зеркальное отражение по главной диагонали: Aᵀᵢⱼ = Aⱼᵢ.</p>`,
   kz:`<p><b>Қарапайым тілмен:</b> Матрица — сандар кестесі. Кеңістікті сығады/бұрады.</p>
<div class="formula-box">$$A=\\begin{pmatrix}a_{11}&a_{12}\\\\a_{21}&a_{22}\\end{pmatrix}\\qquad(AB)_{ij}=\\sum_k a_{ik}b_{kj}$$</div>
<h4>Матрицаларды көбейту</h4><ol>
<li>A бағандар саны = B жолдар саны.</li>
<li>A жолын B бағанына элементтеп көбейтіп, қос.</li>
<li>AB ≠ BA! Реті маңызды!</li></ol>
<p><b>Транспонирлеу</b> — бас диагональ бойынша айналдыру: Aᵀᵢⱼ = Aⱼᵢ.</p>`,
   en:`<p><b>In simple terms:</b> A matrix is a table of numbers. It compresses/rotates space.</p>
<div class="formula-box">$$A=\\begin{pmatrix}a_{11}&a_{12}\\\\a_{21}&a_{22}\\end{pmatrix}\\qquad(AB)_{ij}=\\sum_k a_{ik}b_{kj}$$</div>
<h4>Matrix multiplication</h4><ol>
<li>Columns of A = rows of B.</li>
<li>Multiply row of A by column of B element-wise and sum.</li>
<li>AB ≠ BA! Order matters!</li></ol>
<p><b>Transpose</b> — reflection across the main diagonal: Aᵀᵢⱼ = Aⱼᵢ.</p>`}},
 {icon:'🔲',title:{ru:'Определитель и обратная матрица',kz:'Анықтауыш және кері матрица',en:'Determinant and inverse matrix'},
  content:{
   ru:`<p><b>На пальцах:</b> Определитель — число, характеризующее матрицу. det=0 → обратной нет.</p>
<div class="formula-box">$$\\det\\begin{pmatrix}a&b\\\\c&d\\end{pmatrix}=ad-bc$$<br>$$A^{-1}=\\frac{1}{\\det A}\\cdot A^*\\qquad A\\cdot A^{-1}=E$$</div>
<div class="tip-box">Правило Саррюса для 3×3: диагонали вниз-вправо (+), вниз-влево (−).</div>
<h4>Геометрический смысл det</h4>
<p>Определитель — коэффициент изменения площади (2D) или объёма (3D). det=0 — пространство «схлопнулось».</p>`,
   kz:`<p><b>Қарапайым тілмен:</b> Анықтауыш — матрицаны сипаттайтын сан. det=0 → кері матрица жоқ.</p>
<div class="formula-box">$$\\det\\begin{pmatrix}a&b\\\\c&d\\end{pmatrix}=ad-bc$$<br>$$A^{-1}=\\frac{1}{\\det A}\\cdot A^*\\qquad A\\cdot A^{-1}=E$$</div>
<div class="tip-box">3×3 үшін Саррюс ережесі: оңға төмен диагональдар (+), солға төмен (−).</div>
<h4>det геометриялық мағынасы</h4>
<p>Анықтауыш — аудан (2D) немесе көлем (3D) өзгерісінің коэффициенті. det=0 — кеңістік «сығылды».</p>`,
   en:`<p><b>In simple terms:</b> The determinant is a number characterizing a matrix. det=0 → no inverse exists.</p>
<div class="formula-box">$$\\det\\begin{pmatrix}a&b\\\\c&d\\end{pmatrix}=ad-bc$$<br>$$A^{-1}=\\frac{1}{\\det A}\\cdot A^*\\qquad A\\cdot A^{-1}=E$$</div>
<div class="tip-box">Sarrus' rule for 3×3: diagonals down-right (+), down-left (−).</div>
<h4>Geometric meaning of det</h4>
<p>The determinant is the scaling factor of area (2D) or volume (3D). det=0 — space "collapsed".</p>`}},
 {icon:'➡️',title:{ru:'Векторы',kz:'Векторлар',en:'Vectors'},
  content:{
   ru:`<p><b>На пальцах:</b> Вектор — стрелка с длиной и направлением.</p>
<div class="formula-box">$$\\vec a\\cdot\\vec b=|\\vec a||\\vec b|\\cos\\theta\\quad(\\text{скалярное}\\to\\text{число})$$<br>$$\\vec a\\cdot\\vec b=a_xb_x+a_yb_y+a_zb_z$$<br>$$|\\vec a\\times\\vec b|=|\\vec a||\\vec b|\\sin\\theta\\quad(\\text{векторное}\\to\\vec\\perp)$$</div>
<h4>Что определяют произведения</h4><ul>
<li><b>Скалярное = 0</b> → векторы перпендикулярны</li>
<li><b>Векторное = 0</b> → векторы параллельны</li>
<li><b>|a×b|</b> = площадь параллелограмма на a, b</li></ul>`,
   kz:`<p><b>Қарапайым тілмен:</b> Вектор — ұзындығы мен бағыты бар көрсеткі.</p>
<div class="formula-box">$$\\vec a\\cdot\\vec b=|\\vec a||\\vec b|\\cos\\theta\\quad(\\text{скаляр}\\to\\text{сан})$$<br>$$\\vec a\\cdot\\vec b=a_xb_x+a_yb_y+a_zb_z$$<br>$$|\\vec a\\times\\vec b|=|\\vec a||\\vec b|\\sin\\theta\\quad(\\text{вектор}\\to\\vec\\perp)$$</div>
<h4>Көбейтінділер нені анықтайды</h4><ul>
<li><b>Скаляр = 0</b> → векторлар перпендикуляр</li>
<li><b>Вектор = 0</b> → векторлар параллель</li>
<li><b>|a×b|</b> = a, b-дағы параллелограмм ауданы</li></ul>`,
   en:`<p><b>In simple terms:</b> A vector is an arrow with length and direction.</p>
<div class="formula-box">$$\\vec a\\cdot\\vec b=|\\vec a||\\vec b|\\cos\\theta\\quad(\\text{dot}\\to\\text{number})$$<br>$$\\vec a\\cdot\\vec b=a_xb_x+a_yb_y+a_zb_z$$<br>$$|\\vec a\\times\\vec b|=|\\vec a||\\vec b|\\sin\\theta\\quad(\\text{cross}\\to\\vec\\perp)$$</div>
<h4>What the products tell us</h4><ul>
<li><b>Dot = 0</b> → vectors are perpendicular</li>
<li><b>Cross = 0</b> → vectors are parallel</li>
<li><b>|a×b|</b> = area of the parallelogram on a, b</li></ul>`}},
 {icon:'🔑',title:{ru:'Собственные значения',kz:'Меншікті мәндер',en:'Eigenvalues'},
  content:{
   ru:`<p><b>На пальцах:</b> Собственный вектор — матрица его только растягивает, не поворачивает.</p>
<div class="formula-box">$$A\\vec v=\\lambda\\vec v\\qquad\\det(A-\\lambda E)=0$$</div>
<h4>Алгоритм</h4><ol>
<li>Реши det(A−λE)=0 → найди λ.</li>
<li>Для каждого λ реши (A−λE)v=0.</li>
<li>Ненулевые решения — собственные векторы.</li></ol>
<div class="tip-box">В PageRank — собственный вектор матрицы переходов. В PCA — собственные векторы ковариационной матрицы.</div>`,
   kz:`<p><b>Қарапайым тілмен:</b> Меншікті вектор — матрица оны тек созады, бұрмайды.</p>
<div class="formula-box">$$A\\vec v=\\lambda\\vec v\\qquad\\det(A-\\lambda E)=0$$</div>
<h4>Алгоритм</h4><ol>
<li>det(A−λE)=0 шеш → λ тап.</li>
<li>Әр λ үшін (A−λE)v=0 шеш.</li>
<li>Нөл емес шешімдер — меншікті векторлар.</li></ol>
<div class="tip-box">PageRank-те — ауысу матрицасының меншікті векторы. PCA-да — ковариация матрицасының меншікті векторлары.</div>`,
   en:`<p><b>In simple terms:</b> An eigenvector is only stretched by the matrix, not rotated.</p>
<div class="formula-box">$$A\\vec v=\\lambda\\vec v\\qquad\\det(A-\\lambda E)=0$$</div>
<h4>Algorithm</h4><ol>
<li>Solve det(A−λE)=0 → find λ.</li>
<li>For each λ, solve (A−λE)v=0.</li>
<li>Non-zero solutions are eigenvectors.</li></ol>
<div class="tip-box">In PageRank — an eigenvector of the transition matrix. In PCA — eigenvectors of the covariance matrix.</div>`}}
],
prob:[
 {icon:'🎰',title:{ru:'Основы теории вероятностей',kz:'Ықтималдық теориясының негіздері',en:'Probability basics'},
  content:{
   ru:`<p><b>На пальцах:</b> Вероятность = благоприятные исходы / все исходы.</p>
<div class="formula-box">$$P(A)=\\frac{m}{n},\\quad 0\\leq P(A)\\leq 1$$<br>$$P(A\\cup B)=P(A)+P(B)-P(A\\cap B)$$<br>$$P(A\\cap B)=P(A)\\cdot P(B)\\quad(\\text{если независимы})$$</div>
<h4>Формула Байеса</h4>
<div class="formula-box">$$P(A|B)=\\frac{P(B|A)\\cdot P(A)}{P(B)}$$</div>
<div class="tip-box">Байес обновляет вероятность при новой информации. Основа машинного обучения, диагностики, спам-фильтров!</div>`,
   kz:`<p><b>Қарапайым тілмен:</b> Ықтималдық = қолайлы жағдайлар / барлық жағдайлар.</p>
<div class="formula-box">$$P(A)=\\frac{m}{n},\\quad 0\\leq P(A)\\leq 1$$<br>$$P(A\\cup B)=P(A)+P(B)-P(A\\cap B)$$<br>$$P(A\\cap B)=P(A)\\cdot P(B)\\quad(\\text{тәуелсіз болса})$$</div>
<h4>Байес формуласы</h4>
<div class="formula-box">$$P(A|B)=\\frac{P(B|A)\\cdot P(A)}{P(B)}$$</div>
<div class="tip-box">Байес жаңа ақпарат алғанда ықтималдықты жаңартады. Машиналық оқыту, диагностика, спам-сүзгілердің негізі!</div>`,
   en:`<p><b>In simple terms:</b> Probability = favorable outcomes / total outcomes.</p>
<div class="formula-box">$$P(A)=\\frac{m}{n},\\quad 0\\leq P(A)\\leq 1$$<br>$$P(A\\cup B)=P(A)+P(B)-P(A\\cap B)$$<br>$$P(A\\cap B)=P(A)\\cdot P(B)\\quad(\\text{if independent})$$</div>
<h4>Bayes' formula</h4>
<div class="formula-box">$$P(A|B)=\\frac{P(B|A)\\cdot P(A)}{P(B)}$$</div>
<div class="tip-box">Bayes updates probability with new information. Foundation of ML, diagnostics, spam filters!</div>`}},
 {icon:'📉',title:{ru:'Комбинаторика',kz:'Комбинаторика',en:'Combinatorics'},

/* ============================================================
   STATE & COOKIES
============================================================ */
let state = { lang:'ru', theme:'light', progress:{}, quizBest:0, notes:'' };

function setCookie(name,val,days=365){
  const d=new Date(); d.setTime(d.getTime()+days*864e5);
  document.cookie=`${name}=${encodeURIComponent(val)};expires=${d.toUTCString()};path=/;SameSite=Lax`;
}
function getCookie(name){
  const m=document.cookie.match(new RegExp('(^| )'+name+'=([^;]+)'));
  return m?decodeURIComponent(m[2]):null;
}
function saveState(){ setCookie('mathuni_state', JSON.stringify(state)); }
function loadState(){
  try{ const c=getCookie('mathuni_state'); if(c) state={...state,...JSON.parse(c)}; }catch(e){}
}
function resetAll(){
  document.cookie='mathuni_state=;expires=Thu, 01 Jan 1970;path=/';
  state={lang:'ru',theme:'light',progress:{},quizBest:0,notes:''};
  applyLang(); applyTheme(); renderAll();
  toast(t('t_reset'));
}

/* ============================================================
   LANGUAGE / THEME
============================================================ */
function t(k){ return I18N[state.lang][k]||k; }
function applyLang(){
  document.documentElement.lang=state.lang;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===state.lang));
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent=t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{ el.placeholder=t(el.dataset.i18nPh); });
  renderNav(); renderAll();
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme',state.theme);

function switchCalc(id){
  document.querySelectorAll('#calcTabs .tab').forEach(x=>x.classList.toggle('active',x.dataset.c===id));
  document.querySelectorAll('#calcPanels .panel').forEach(x=>x.classList.remove('active'));

}

function solveQuad(){
  const a=+document.getElementById('qa').value,b=+document.getElementById('qb').value,c=+document.getElementById('qc').value;
  const r=document.getElementById('res-quad');
  if(a===0){r.innerHTML='⚠️ a=0!';return;}
  const D=b*b-4*a*c;
  let h=`<div class="step">${a}x² + (${b})x + (${c}) = 0</div><div class="step">D = ${b}² − 4·${a}·${c} = <b>${D.toFixed(4)}</b></div>`;
  if(D<0){const re=(-b/(2*a)).toFixed(4),im=(Math.sqrt(-D)/(2*a)).toFixed(4);
    h+=`<div class="step">x₁ = ${re} + ${im}i</div><div class="step">x₂ = ${re} − ${im}i</div>`;
  }else if(D===0){h+=`<div class="step">x = <b>${(-b/(2*a)).toFixed(4)}</b></div>`;
  }else{const x1=(-b+Math.sqrt(D))/(2*a),x2=(-b-Math.sqrt(D))/(2*a);
    h+=`<div class="step">x₁ = <b>${x1.toFixed(4)}</b></div><div class="step">x₂ = <b>${x2.toFixed(4)}</b></div>`;
    h+=`<div class="step">Vieta: x₁+x₂ = ${(x1+x2).toFixed(4)} = −b/a ✓</div>`;}
  r.innerHTML=h;
}
function solveMatrix(){
  const m=[[+m11.value,+m12.value],[+m21.value,+m22.value]];
  const det=m[0][0]*m[1][1]-m[0][1]*m[1][0],tr=m[0][0]+m[1][1];
  let h=`<div class="step">det = <b>${det}</b></div><div class="step">tr = <b>${tr}</b></div>`;
  if(det!==0){const inv=[[m[1][1]/det,-m[0][1]/det],[-m[1][0]/det,m[0][0]/det]];
    h+=`<div class="step">A⁻¹ = [[${inv[0][0].toFixed(3)}, ${inv[0][1].toFixed(3)}], [${inv[1][0].toFixed(3)}, ${inv[1][1].toFixed(3)}]]</div>`;
  }else{h+=`<div class="step" style="color:var(--danger)">⚠️ det=0 → no inverse</div>`;}
  document.getElementById('res-matrix').innerHTML=h;
}
function parseFunc(s){
  s=s.replace(/\s/g,'').replace(/\^/g,'**').replace(/sin/g,'Math.sin').replace(/cos/g,'Math.cos')
    .replace(/tan/g,'Math.tan').replace(/exp/g,'Math.exp').replace(/ln/g,'Math.log')
    .replace(/log/g,'Math.log10').replace(/sqrt/g,'Math.sqrt').replace(/abs/g,'Math.abs')
    .replace(/pi/g,'Math.PI').replace(/e(?![x])/g,'Math.E');
  return x=>{try{return Function('x','return '+s)(x);}catch(e){return NaN;}};
}
function solveDeriv(){
  const f=parseFunc(document.getElementById('d-func').value),x0=+document.getElementById('d-x').value,h=1e-6;
  const fp=(f(x0+h)-f(x0-h))/(2*h),fpp=(f(x0+h)-2*f(x0)+f(x0-h))/(h*h),y0=f(x0);
  document.getElementById('res-deriv').innerHTML=
    `<div class="step">f(${x0}) = <b>${y0.toFixed(6)}</b></div>
     <div class="step">f′(${x0}) ≈ <b>${fp.toFixed(6)}</b></div>
     <div class="step">f″(${x0}) ≈ <b>${fpp.toFixed(6)}</b></div>
     <div class="step">y = ${fp.toFixed(3)}·(x−${x0}) + ${y0.toFixed(3)}</div>`;
}
function solveStats(){
  const arr=document.getElementById('s-data').value.split(',').map(s=>parseFloat(s.trim())).filter(x=>!isNaN(x));
  if(!arr.length){document.getElementById('res-stats').innerHTML='⚠️';return;}
  const n=arr.length,sorted=[...arr].sort((a,b)=>a-b);
  const mean=arr.reduce((a,b)=>a+b,0)/n;
  const variance=arr.reduce((a,b)=>a+(b-mean)**2,0)/n;
  const median=n%2?sorted[(n-1)/2]:(sorted[n/2-1]+sorted[n/2])/2;
  document.getElementById('res-stats').innerHTML=
    `<div class="step">n = ${n}, sum = ${arr.reduce((a,b)=>a+b,0).toFixed(3)}</div>
     <div class="step">mean = <b>${mean.toFixed(4)}</b></div>
     <div class="step">median = <b>${median}</b></div>
     <div class="step">variance = <b>${variance.toFixed(4)}</b></div>
     <div class="step">σ = <b>${Math.sqrt(variance).toFixed(4)}</b></div>`;
}
function fact(n){let r=1;for(let i=2;i<=n;i++)r*=i;return r;}
function solveComb(){
  const n=+document.getElementById('c-n').value,k=+document.getElementById('c-k').value;
  if(n<0||k<0||k>n){document.getElementById('res-comb').innerHTML='⚠️';return;}
  document.getElementById('res-comb').innerHTML=
    `<div class="step">n! = <b>${fact(n)}</b></div>
     <div class="step">A(n,k) = <b>${fact(n)/fact(n-k)}</b></div>
     <div class="step">C(n,k) = <b>${fact(n)/(fact(k)*fact(n-k))}</b></div>`;
}
function solveTrig(){
  const d=+document.getElementById('t-angle').value,r=d*Math.PI/180;
  const s=Math.sin(r),c=Math.cos(r);
  document.getElementById('res-trig').innerHTML=
    `<div class="step">${d}° = ${r.toFixed(4)} rad</div>
     <div class="step">sin = <b>${s.toFixed(6)}</b></div>
     <div class="step">cos = <b>${c.toFixed(6)}</b></div>
     <div class="step">tan = <b>${Math.tan(r).toFixed(6)}</b></div>
     <div class="step">sin²+cos² = ${(s*s+c*c).toFixed(6)} ✓</div>`;
}
function solveLog(){
  const a=+document.getElementById('l-a').value,b=+document.getElementById('l-b').value;
  if(a<=0||a===1||b<=0){document.getElementById('res-log').innerHTML='⚠️';return;}
  const r=Math.log(b)/Math.log(a);
  document.getElementById('res-log').innerHTML=
    `<div class="step">log_${a}(${b}) = ${Math.log(b).toFixed(4)} / ${Math.log(a).toFixed(4)}</div>
     <div class="step">= <b>${r.toFixed(6)}</b></div>
     <div class="step">${a}^${r.toFixed(4)} = ${Math.pow(a,r).toFixed(4)} ≈ ${b} ✓</div>`;
}

/* ============================================================
   PLOT
============================================================ */
function drawPlot(){
  const cv=document.getElementById('plotCanvas');if(!cv)return;
  const ctx=cv.getContext('2d'),W=cv.clientWidth,H=cv.clientHeight;
  cv.width=W;cv.height=H;
  const f=parseFunc(document.getElementById('p-func').value);
  const xmin=+document.getElementById('p-xmin').value,xmax=+document.getElementById('p-xmax').value;
  const N=600,pts=[];let ymin=Infinity,ymax=-Infinity;
  for(let i=0;i<=N;i++){const x=xmin+(xmax-xmin)*i/N,y=f(x);
    if(isFinite(y)){pts.push([x,y]);if(y<ymin)ymin=y;if(y>ymax)ymax=y;}}
  if(!isFinite(ymin)){ymin=-10;ymax=10;}
  const pad=(ymax-ymin)*.15||1;ymin-=pad;ymax+=pad;
  const sx=x=>(x-xmin)/(xmax-xmin)*W,sy=y=>H-(y-ymin)/(ymax-ymin)*H;
  ctx.fillStyle=state.theme==='dark'?'#1e2536':'#eef1f8';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=state.theme==='dark'?'#252d42':'#e5e7eb';ctx.lineWidth=1;
  for(let i=0;i<=10;i++){ctx.beginPath();ctx.moveTo(0,H*i/10);ctx.lineTo(W,H*i/10);ctx.stroke();
    ctx.beginPath();ctx.moveTo(W*i/10,0);ctx.lineTo(W*i/10,H);ctx.stroke();}
  ctx.strokeStyle='#9aa1b5';ctx.lineWidth=2;
  const y0=sy(0),x0=sx(0);
  if(y0>=0&&y0<=H){ctx.beginPath();ctx.moveTo(0,y0);ctx.lineTo(W,y0);ctx.stroke();}
  if(x0>=0&&x0<=W){ctx.beginPath();ctx.moveTo(x0,0);ctx.lineTo(x0,H);ctx.stroke();}
  ctx.strokeStyle='#4f46e5';ctx.lineWidth=2.5;ctx.beginPath();let st=false;
  pts.forEach(([x,y])=>{const px=sx(x),py=sy(y);
    if(py<-1000||py>H+1000){st=false;return;}
    if(!st){ctx.moveTo(px,py);st=true;}else ctx.lineTo(px,py);});
  ctx.stroke();
  document.getElementById('plot-info').innerHTML=
    `<b>f(x) = ${document.getElementById('p-func').value}</b><br>x ∈ [${xmin}, ${xmax}], y ∈ [${ymin.toFixed(2)}, ${ymax.toFixed(2)}]`;
}

function setQC(n){quizCount=n;renderQuizSetup();}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startQuiz(){
  let topics=quizTopic==='all'?Object.keys(QUIZ):[quizTopic];
  let pool=[];topics.forEach(tp=>(QUIZ[tp]||[]).forEach(q=>pool.push({...q,topic:tp})));
  pool=shuffle(pool).slice(0,quizCount).map(q=>{
    const idx=shuffle(q.a[state.lang].map((_,i)=>i));
    return {...q,a:idx.map(i=>q.a[state.lang][i]),c:idx.indexOf(q.c)};
  });
  quiz={qs:pool,cur:0,ans:new Array(pool.length).fill(-1)};
  renderQuiz();
}
function renderQuiz(){
  const q=quiz.qs[quiz.cur],pct=(quiz.cur/quiz.qs.length)*100;
  document.getElementById('quizArea').innerHTML=`
    <div class="quiz-card">
      <div style="display:flex;justify-content:space-between;margin-bottom:10px;font-size:13px;color:var(--muted)">
        <span>${t('quiz_q')} ${quiz.cur+1} ${t('quiz_of')} ${quiz.qs.length}</span></div>
      <div class="prog-bar" style="margin-bottom:18px"><div class="prog-fill" style="width:${pct}%"></div></div>
      <div class="quiz-q">${q.q[state.lang]}</div>
      <div class="q-answers">${q.a.map((a,i)=>`<button class="q-ans ${quiz.ans[quiz.cur]===i?'sel':''}" onclick="pickAns(${i})">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}</div>
      <div style="display:flex;justify-content:space-between;gap:10px">
        <button class="btn btn-sec" onclick="quizNav(-1)" ${quiz.cur===0?'disabled style="opacity:.4"':''}>${t('quiz_prev')}</button>
        ${quiz.cur===quiz.qs.length-1?`<button class="btn" onclick="finishQuiz()">${t('quiz_finish')}</button>`
          :`<button class="btn" onclick="quizNav(1)">${t('quiz_next')}</button>`}
      </div>
    </div>`;
}
function pickAns(i){quiz.ans[quiz.cur]=i;renderQuiz();}
function quizNav(d){quiz.cur+=d;renderQuiz();}
function finishQuiz(){
  let ok=0;quiz.qs.forEach((q,i)=>{if(quiz.ans[i]===q.c)ok++;});
  const total=quiz.qs.length,pct=Math.round(ok/total*100);
  if(pct>state.quizBest){state.quizBest=pct;saveState();}
  const msg=pct>=90?'quiz_great':pct>=70?'quiz_good':pct>=50?'quiz_ok':'quiz_bad';
  document.getElementById('quizArea').innerHTML=`
    <div class="quiz-card" style="text-align:center">
      <h3>${t('quiz_done')}</h3><div class="quiz-score">${pct}%</div>
      <p style="font-size:18px">${t('quiz_correct')}: <b>${ok} / ${total}</b></p>
      <p style="color:var(--muted);margin:10px 0">${t(msg)}</p>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap">
        <button class="btn" onclick="reviewQuiz()">${t('quiz_review')}</button>
        <button class="btn btn-sec" onclick="resetQuiz()">${t('quiz_new')}</button>
      </div>
    </div>`;
  renderStats();
}
function reviewQuiz(){
  let h='<div class="quiz-card">';
  quiz.qs.forEach((q,i)=>{
    const u=quiz.ans[i],ok=u===q.c;
    h+=`<div style="margin-bottom:18px;padding:15px;background:var(--surface2);border-radius:11px;border-left:3px solid ${ok?'var(--success)':'var(--danger)'}">
      <div style="font-weight:700;margin-bottom:9px">${i+1}. ${q.q[state.lang]}</div>
      ${q.a.map((a,j)=>{let c='';if(j===q.c)c='correct';else if(j===u&&!ok)c='wrong';
        return `<div class="q-ans ${c}" style="cursor:default;margin:4px 0">${String.fromCharCode(65+j)}. ${a}${j===q.c?' ✓':''}${j===u&&!ok?' ✗':''}</div>`;}).join('')}
    </div>`;
  });
  h+=`<button class="btn" onclick="resetQuiz()">${t('quiz_new')}</button></div>`;
  document.getElementById('quizArea').innerHTML=h;
}
function resetQuiz(){quiz=null;renderQuizSetup();}

/* ============================================================
   NOTES (cookie + file export/import)
============================================================ */
function saveNotes(){
  state.notes=document.getElementById('notesArea').value;
  saveState();renderStats();toast(t('t_saved'));
}
function exportNotes(){
  const data=JSON.stringify({notes:state.notes,progress:state.progress,quizBest:state.quizBest,exported:new Date().toISOString()},null,2);
  const blob=new Blob([data],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='math_universe_backup.json';a.click();toast(t('t_export'));
}
function importNotes(inp){
  const f=inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=e=>{try{
    const d=JSON.parse(e.target.result);
    if(d.notes)state.notes=d.notes;
    if(d.progress)state.progress=d.progress;
    if(d.quizBest)state.quizBest=d.quizBest;
    saveState();renderAll();toast(t('t_import'));
  }catch(err){toast('⚠️ Error');}};
  rd.readAsText(f);inp.value='';
}

/* ============================================================
   TOAST
============================================================ */
let toastTimer;
function toast(msg){
  const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200);
}

/* ============================================================
   MATH RENDER
============================================================ */
function renderMath(){
  if(window.renderMathInElement){
    renderMathInElement(document.body,{delimiters:[
      {left:'$$',right:'$$',display:true},{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}
    ],throwOnError:false});
  }
}

/* ============================================================
   INIT
============================================================ */
loadState();
applyTheme();
buildCalc();
applyLang();
setTimeout(renderMath,300);
</script>
